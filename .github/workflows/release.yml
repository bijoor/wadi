name: Release desktop app

# PARKED (2026-08): this account's GitHub Actions compute is billing-locked
# (GitHub disabled recurring card payments for India-based accounts), so every
# run of this workflow fails instantly with "the job was not started because your
# account is locked due to a billing issue." The trigger is therefore switched
# from tag-push to MANUAL (workflow_dispatch) so pushing a version tag no longer
# spawns a guaranteed-failing run.
#
# Until Actions is restored, releases are built LOCALLY and published to GitHub
# Releases (which are NOT billing-locked):
#   scripts/release-desktop.sh [--linux]   # build macOS universal (+ Linux via Docker)
#   scripts/publish-release.sh v0.1.0      # upload to a draft GitHub Release
# The website deploys to Cloudflare Pages instead of GitHub Pages:
#   scripts/deploy-site.sh
# See RELEASING.md for the full runbook.
#
# The job below is kept intact (and Windows-capable) so it can be revived by
# restoring the tag trigger once the billing lock is cleared.
#
# tauri-action runs `tauri build` on each OS (which runs the repo's
# beforeBuildCommand — `npm run build:tauri` from editor/ — to build the
# frontend into docs/, then bundles the native app) and uploads the
# installers to a GitHub Release. The release is created as a DRAFT so you
# can review the assets and edit notes before publishing.
#
# NOTE: builds are UNSIGNED. macOS users open via right-click → Open (once);
# Windows users click "More info → Run anyway" on SmartScreen. Add signing
# secrets later if you want to remove those prompts.

on:
  # Parked: manual-only. To revive tag-triggered releases once Actions billing is
  # restored, uncomment the `push:`/`tags:` block below.
  workflow_dispatch:
  # push:
  #   tags:
  #     - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'      # universal (Apple Silicon + Intel)
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Frontend deps live in editor/ (no root package.json). The peer-dep
      # conflict (three-bvh-csg vs three-mesh-bvh) needs --legacy-peer-deps,
      # matching local dev.
      - name: Install frontend dependencies
        working-directory: editor
        run: npm install --legacy-peer-deps

      - name: Build app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Wadi ${{ github.ref_name }}'
          releaseBody: |
            Desktop builds of Wadi.

            These builds are unsigned:
            - macOS: right-click the app → Open (once) to get past Gatekeeper.
            - Windows: on the SmartScreen prompt, click "More info" → "Run anyway".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
