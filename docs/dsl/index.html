<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wadi WDL playground — model as formal code</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root { --bg:#1e1e1e; --panel:#252526; --border:#333; --accent:#c05a2f; --text:#e6e0d8; --muted:#9b968e; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 8px; padding: 7px 12px;
      background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto;
    }
    header .brand { font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
    header .brand b { color: var(--accent); }
    header .spacer { flex: 1; }
    header a.applink { color: var(--muted); text-decoration: none; font-size: .85rem; white-space: nowrap; }
    header a.applink:hover { color: var(--text); }
    .tb-btn, .tb-sel {
      background: #333; color: var(--text); border: 1px solid #444; border-radius: 6px;
      padding: 5px 10px; font-size: .82rem; cursor: pointer; white-space: nowrap;
    }
    .tb-btn:hover, .tb-sel:hover { background: #3c3c3c; border-color: #555; }
    .tb-sel { padding: 5px 6px; }
    .menu-wrap { position: relative; display: inline-flex; }
    .popup-menu {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 40;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .45); min-width: 240px; padding: 4px;
    }
    .popup-menu[hidden] { display: none; }
    .popup-menu button {
      display: block; width: 100%; text-align: left; background: none; border: 0;
      color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: .82rem;
      cursor: pointer; white-space: nowrap;
    }
    .popup-menu button:hover { background: #3a3a3a; }
    .popup-menu .desc { color: var(--muted); }
    #library-menu { min-width: 280px; max-width: 360px; }
    .lib-sep { height: 1px; background: #3a3a3a; margin: 4px 2px; }
    .lib-empty { color: var(--muted); padding: 8px 10px; font-size: .78rem; line-height: 1.4; white-space: normal; }
    .lib-empty code { background: #1e1e1e; padding: 0 3px; border-radius: 3px; }
    .lib-row { display: flex; align-items: center; gap: 2px; }
    .lib-row .lib-import { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
    .lib-tool {
      flex: 0 0 auto; width: 26px; text-align: center !important; color: var(--muted);
      font-size: .95rem; padding: 6px 0 !important; border-radius: 6px;
    }
    .lib-tool:hover { background: #4a3030 !important; color: #fff; }
    #filename {
      font-size: .8rem; color: var(--muted); white-space: nowrap; font-variant: tabular-nums;
    }
    #filename.dirty { color: var(--accent); font-weight: 600; }
    #status {
      font-size: .8rem; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
      background: #2d4a3e; color: #8fe3bf;
    }
    #status.err { background: #4a2d2d; color: #f0a3a3; }
    /* grid-template-rows: an explicit minmax(0, 1fr) row is REQUIRED — without it
       the implicit `auto` row sizes to the preview iframe's content (which, via
       `height: 100%`, inflates to a large intrinsic height), so the iframe grows
       TALLER than the window and its bottom — where the app's 3D layer/view
       toolbar lives — is clipped off-screen (only visible when maximized). */
    main { flex: 1; display: grid; grid-template-columns: minmax(340px, 44%) 1fr; grid-template-rows: minmax(0, 1fr); min-height: 0; position: relative; }
    .editor-col { display: flex; flex-direction: column; min-width: 0; height: 100%; min-height: 0; border-right: 1px solid var(--border); }
    #editor { flex: 1 1 auto; min-height: 0; }
    .preview { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #0d0d0d; }
    .preview iframe { width: 100%; height: 100%; border: 0; display: block; background: #cfe3d8; }

    /* Problems panel — the detailed, readable list of errors + warnings. */
    #problems { flex: 0 0 auto; max-height: 45%; display: flex; flex-direction: column;
      border-top: 1px solid var(--border); background: #1b1b1b; }
    #problems[hidden] { display: none; }
    #problems.collapsed { max-height: none; }
    #problems.collapsed #prob-list { display: none; }
    .prob-head { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer;
      user-select: none; background: #252526; border-bottom: 1px solid var(--border); font-size: .82rem; }
    .prob-head:hover { background: #2c2c2c; }
    #prob-title { font-weight: 600; }
    .prob-count { font-variant: tabular-nums; margin-left: 2px; }
    .prob-count .e { color: #f0a3a3; } .prob-count .w { color: #e6c07b; }
    #prob-chevron { margin-left: auto; color: var(--muted); transition: transform .12s; }
    #problems.collapsed #prob-chevron { transform: rotate(-90deg); }
    #prob-list { overflow-y: auto; padding: 3px 0; }
    .prob { display: flex; gap: 9px; align-items: baseline; padding: 5px 12px; font-size: .82rem;
      line-height: 1.45; border-left: 3px solid transparent; }
    .prob:hover { background: #2a2a2a; }
    .prob.error { border-left-color: #d9534f; } .prob.warn { border-left-color: #c8952f; }
    .prob.jump { cursor: pointer; }
    .prob .ic { flex: 0 0 auto; } .prob.error .ic { color: #f0a3a3; } .prob.warn .ic { color: #e6c07b; }
    .prob .loc { flex: 0 0 auto; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace;
      white-space: nowrap; }
    .prob .msg { color: var(--text); }

    /* Reference slide-over (over the preview) */
    #reference-panel {
      position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 92%);
      background: var(--panel); border-left: 1px solid var(--border);
      box-shadow: -8px 0 24px rgba(0,0,0,.35); overflow-y: auto; z-index: 20;
      padding: 0 20px 40px;
    }
    #reference-panel[hidden] { display: none; }
    .ref-head {
      position: sticky; top: 0; background: var(--panel); padding: 12px 0 8px;
      display: flex; justify-content: flex-end; border-bottom: 1px solid var(--border); margin-bottom: 8px;
    }
    #ref-close { background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; }
    #ref-close:hover { color: var(--text); }
    #reference-panel h2 { font-size: 1.05rem; margin: 6px 0 4px; }
    #reference-panel h3 { font-size: .92rem; margin: 18px 0 6px; color: var(--accent); }
    #reference-panel .ref-dim { color: var(--muted); font-weight: 400; font-size: .8rem; }
    #reference-panel p.ref-note { color: var(--muted); font-size: .82rem; margin: 6px 0; }
    #reference-panel code { background: #333; padding: 1px 5px; border-radius: 4px; font-size: .82em; }
    #reference-panel pre {
      background: #1b1b1b; border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 12px; overflow-x: auto; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
      color: #d7d0c6; white-space: pre;
    }
    #reference-panel pre b { color: #e0a97a; font-weight: 700; }
    .ref-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .ref-table th, .ref-table td { text-align: left; vertical-align: top; padding: 5px 8px; border-bottom: 1px solid var(--border); }
    .ref-table th { color: var(--muted); font-weight: 600; }
    .ref-table td:first-child { color: #e0a97a; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; }

    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
      .editor-col { border-right: 0; border-bottom: 1px solid var(--border); }
      header .brand { display: none; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-C5WcSW5u.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DyX1CsEw.css">
</head>
<body>
  <header>
    <span class="brand">Wadi <b>WDL</b></span>
    <div class="menu-wrap">
      <button id="new" class="tb-btn" title="Start a new house from a sample" aria-haspopup="true">✨ New ▾</button>
      <div id="new-menu" class="popup-menu" hidden role="menu">
        <button data-sample="minimal">minimal <span class="desc">— smallest valid house</span></button>
        <button data-sample="two_room">two_room <span class="desc">— two rooms, no grid</span></button>
        <button data-sample="two_story">two_story <span class="desc">— plinth + 2 storeys + hip roof</span></button>
        <button data-sample="coastal">coastal <span class="desc">— grid + configurator cottage</span></button>
        <button data-sample="complete">complete <span class="desc">— every entity + module imports</span></button>
        <button data-sample="konkan_cottage">konkan_cottage <span class="desc">— imports furniture + konkan/base packs</span></button>
      </div>
    </div>
    <button id="open" class="tb-btn" title="Open a .wdl file (⌘O)">📂 Open</button>
    <button id="import" class="tb-btn" title="Import a .wadi house → decompile it to editable WDL code">↩ Import .wadi</button>
    <div class="menu-wrap">
      <button id="library" class="tb-btn" title="Save the current file as a reusable library, or insert an import" aria-haspopup="true">📚 Library ▾</button>
      <div id="library-menu" class="popup-menu" hidden role="menu"></div>
    </div>
    <button id="save" class="tb-btn" title="Save the .wdl (⌘S)">💾 Save</button>
    <button id="saveas" class="tb-btn" title="Save to a new file (⇧⌘S)">Save As…</button>
    <button id="download" class="tb-btn" title="Export the compiled .wadi">⬇ .wadi</button>
    <button id="reference" class="tb-btn" title="WDL reference">📖 Reference</button>
    <span class="spacer"></span>
    <span id="filename" title="Current file">untitled.wdl</span>
    <span id="status">starting…</span>
    <a class="applink" href="/app/" target="_blank" rel="noopener">Open the app →</a>
  </header>
  <main>
    <div class="editor-col">
      <div id="editor"></div>
      <div id="problems" hidden>
        <div class="prob-head">
          <span id="prob-title">Problems</span>
          <span id="prob-chevron">▾</span>
        </div>
        <div id="prob-list"></div>
      </div>
    </div>
    <div class="preview">
      <!-- main.ts boots the app at /app/?panels=off&load=<blob url of the first
           compiled house> (the ?load path frames the camera), then live-updates
           via window.wadi.load() on every edit. -->
      <iframe id="preview" title="Wadi model preview"></iframe>
    </div>
    <aside id="reference-panel" hidden>
      <div class="ref-head"><button id="ref-close" title="Close">✕</button></div>
      <div id="reference-body"></div>
    </aside>
  </main>
  <input type="file" id="file" accept=".wdl,.txt" hidden />
  <input type="file" id="wadi-file" accept=".wadi,.json" hidden />
  <input type="file" id="lib-file" accept=".wdl" multiple hidden />
</body>
</html>
